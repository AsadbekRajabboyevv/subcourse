<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Test yaratish - PREP.UZ</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'prep-blue': '#3b82f6',
                            'prep-blue-dark': '#2563eb',
                            'prep-green': '#4ade80',
                            'prep-green-dark': '#22c55e',
                        }
                    }
                }
            }
        </script>
        <style>
            .image-preview {
                max-height: 200px;
                object-fit: contain;
            }

            .question-card {
                transition: all 0.3s ease;
            }

            .question-card:hover {
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }

            .animate-in {
                animation: fadeIn 0.3s ease-out;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
    </head>
    <body class="bg-gray-100 min-h-screen">
        <div layout:fragment="content">
            <div class="max-w-4xl mx-auto px-4 py-8">
                <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
                    <!-- Header -->
                    <div class="bg-blue-600 from-prep-blue to-prep-blue-dark p-6 text-white">
                        <h1 class="text-2xl font-bold">Test yaratish</h1>
                        <p class="text-blue-100 mt-1">Yangi test qo'shing</p>
                    </div>

                    <form id="testForm" class="p-6">
                        <!-- Test Information -->
                        <div class="mb-6">
                            <label for="testTitle" class="block text-sm font-semibold text-gray-700 mb-2">Test nomi</label>
                            <input type="text" id="testTitle" name="testTitle" class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-prep-blue focus:border-prep-blue" placeholder="Test nomini kiriting" required>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <input type="hidden" id="testSubject" name="testSubject" class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-prep-blue focus:border-prep-blue" th:value="${lessonId}">
                            </div>
                            <div>
                                <label for="testDuration" class="block text-sm font-semibold text-gray-700 mb-2">Test davomiyligi (daqiqalarda)</label>
                                <input type="number" id="testDuration" name="testDuration" class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-prep-blue focus:border-prep-blue" min="1" placeholder="60" required>
                            </div>
                        </div>

                        <div class="border-t border-gray-200 pt-6 mb-6">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-lg font-semibold text-gray-800">Savollar</h2>
                                <button type="button" id="addQuestionBtn" class="inline-flex items-center px-4 py-2 bg-prep-green border border-transparent rounded-lg shadow-sm text-sm font-medium text-white hover:bg-prep-green-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-prep-green">
                                    <i data-lucide="plus" class="w-5 h-5 mr-1"></i>
                                    Savol qo'shish
                                </button>
                            </div>

                            <div id="questionsContainer" class="space-y-6">
                                <!-- Questions will be added here dynamically -->
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="flex flex-col sm:flex-row sm:justify-end space-y-3 sm:space-y-0 sm:space-x-4 mt-8 border-t border-gray-200 pt-6">
                            <a th:href="@{/lessons/view/{id}(id=${lessonId})}" type="button" class="w-full sm:w-auto px-5 py-3 border-2 border-gray-300 rounded-lg shadow-sm text-base font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-prep-blue transition-colors">
                                Bekor qilish
                            </a>
                            <button type="submit" class="w-full sm:w-auto px-5 py-3 bg-green-400 from-prep-blue to-prep-blue-dark border border-transparent rounded-lg shadow-sm text-base font-medium text-white hover:from-prep-blue-dark hover:to-prep-blue focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-prep-blue transition-colors">
                                Testni saqlash
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Question Template (hidden) -->
            <template id="questionTemplate">
                <div class="question-card p-5 border border-gray-200 rounded-xl bg-white animate-in">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-base font-semibold text-gray-700">Savol #<span class="question-number">1</span></h3>
                        <button type="button" class="remove-question text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors p-1.5 rounded-full">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Savol matni</label>
                        <textarea name="questions[0][text]" rows="2" class="question-text block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-prep-blue focus:border-prep-blue" placeholder="Savol matnini kiriting" required></textarea>
                    </div>

                    <div class="mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-semibold text-gray-700">Savol rasmi (ixtiyoriy)</label>
                            <button type="button" class="clear-image hidden text-sm text-red-500 hover:text-red-700">
                                <i data-lucide="x" class="w-4 h-4 inline-block"></i> Rasmni o'chirish
                            </button>
                        </div>
                        <div class="image-upload-container border-2 border-dashed border-gray-300 rounded-lg p-4 text-center bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer">
                            <input type="file" name="questions[0][image]" class="question-image-input hidden" accept="image/*">
                            <div class="image-upload-placeholder">
                                <i data-lucide="image-plus" class="w-10 h-10 mx-auto text-gray-400 mb-2"></i>
                                <p class="text-sm text-gray-500">Rasmni tanlash uchun bosing yoki bu yerga tashlang</p>
                                <p class="text-xs text-gray-400 mt-1">JPG, PNG, GIF (max. 2MB)</p>
                            </div>
                            <div class="image-preview-container hidden mt-2">
                                <img src="#" alt="Savol rasmi" class="image-preview mx-auto">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Javob variantlari</label>
                        <div class="options-container space-y-3 bg-gray-50 p-4 rounded-lg">
                            <div class="option-item flex items-center">
                                <input type="radio" name="questions[0][correct]" value="0" class="h-5 w-5 text-prep-blue border-gray-300 focus:ring-prep-blue" checked>
                                <input type="text" name="questions[0][options][0]" class="ml-3 flex-1 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-prep-blue focus:border-prep-blue" placeholder="Javob variantini kiriting" required>
                                <button type="button" class="remove-option ml-2 p-1.5 rounded-full text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors hidden">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <div class="option-item flex items-center">
                                <input type="radio" name="questions[0][correct]" value="1" class="h-5 w-5 text-prep-blue border-gray-300 focus:ring-prep-blue">
                                <input type="text" name="questions[0][options][1]" class="ml-3 flex-1 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-prep-blue focus:border-prep-blue" placeholder="Javob variantini kiriting" required>
                                <button type="button" class="remove-option ml-2 p-1.5 rounded-full text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors hidden">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <div class="option-item flex items-center">
                                <input type="radio" name="questions[0][correct]" value="2" class="h-5 w-5 text-prep-blue border-gray-300 focus:ring-prep-blue">
                                <input type="text" name="questions[0][options][2]" class="ml-3 flex-1 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-prep-blue focus:border-prep-blue" placeholder="Javob variantini kiriting" required>
                                <button type="button" class="remove-option ml-2 p-1.5 rounded-full text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <div class="option-item flex items-center">
                                <input type="radio" name="questions[0][correct]" value="3" class="h-5 w-5 text-prep-blue border-gray-300 focus:ring-prep-blue">
                                <input type="text" name="questions[0][options][3]" class="ml-3 flex-1 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-prep-blue focus:border-prep-blue" placeholder="Javob variantini kiriting" required>
                                <button type="button" class="remove-option ml-2 p-1.5 rounded-full text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <button type="button" class="add-option text-sm text-prep-blue hover:text-prep-blue-dark font-medium flex items-center mt-2">
                                <i data-lucide="plus-circle" class="w-4 h-4 mr-1"></i> Variant qo'shish
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Initialize Lucide Icons -->
            <script>
                lucide.createIcons();
            </script>

            <!-- JavaScript for Form Handling -->
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    // Elements
                    const testForm = document.getElementById('testForm');
                    const addQuestionBtn = document.getElementById('addQuestionBtn');
                    const questionsContainer = document.getElementById('questionsContainer');
                    const questionTemplate = document.getElementById('questionTemplate');

                    // Variables
                    let questionCount = 0;
                    const MAX_FILE_SIZE = 2 * 1024 * 1024; // 2MB

                    // Add initial question
                    addQuestion();

                    // Add question button click handler
                    addQuestionBtn.addEventListener('click', function() {
                        addQuestion();
                    });

                    // Form submission handler
                    testForm.addEventListener('submit', function(e) {
                        e.preventDefault();

                        // Show loading state
                        const submitButton = testForm.querySelector('button[type="submit"]');
                        const originalText = submitButton.innerHTML;
                        submitButton.disabled = true;
                        submitButton.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Yuklanmoqda...';

                        // Simulate form submission
                        setTimeout(() => {
                            alert('Test muvaffaqiyatli saqlandi!');

                            // Reset form
                            testForm.reset();

                            // Clear all questions except the first one
                            const questions = questionsContainer.querySelectorAll('.question-card');
                            for (let i = 1; i < questions.length; i++) {
                                questions[i].remove();
                            }

                            // Reset first question
                            if (questions.length > 0) {
                                const firstQuestion = questions[0];
                                const textArea = firstQuestion.querySelector('textarea');
                                if (textArea) textArea.value = '';

                                const imageInput = firstQuestion.querySelector('input[type="file"]');
                                if (imageInput) imageInput.value = '';

                                const imagePreviewContainer = firstQuestion.querySelector('.image-preview-container');
                                if (imagePreviewContainer) imagePreviewContainer.classList.add('hidden');

                                const imageUploadPlaceholder = firstQuestion.querySelector('.image-upload-placeholder');
                                if (imageUploadPlaceholder) imageUploadPlaceholder.classList.remove('hidden');

                                const clearImageBtn = firstQuestion.querySelector('.clear-image');
                                if (clearImageBtn) clearImageBtn.classList.add('hidden');

                                const optionInputs = firstQuestion.querySelectorAll('input[type="text"]');
                                optionInputs.forEach(input => {
                                    input.value = '';
                                });

                                const radioInputs = firstQuestion.querySelectorAll('input[type="radio"]');
                                if (radioInputs.length > 0) {
                                    radioInputs[0].checked = true;
                                }
                            }

                            // Reset question count
                            questionCount = 1;

                            // Reset button
                            submitButton.disabled = false;
                            submitButton.innerHTML = originalText;
                        }, 2000);
                    });

                    // Event delegation for dynamic elements
                    questionsContainer.addEventListener('click', function(e) {
                        // Remove question
                        if (e.target.closest('.remove-question')) {
                            const questionCard = e.target.closest('.question-card');

                            // Don't remove if it's the last question
                            if (questionsContainer.children.length > 1) {
                                questionCard.remove();

                                // Update question numbers
                                updateQuestionNumbers();
                            }
                        }

                        // Add option
                        if (e.target.closest('.add-option')) {
                            const addOptionBtn = e.target.closest('.add-option');
                            const optionsContainer = addOptionBtn.closest('.options-container');
                            const questionCard = addOptionBtn.closest('.question-card');
                            const questionIndex = Array.from(questionsContainer.children).indexOf(questionCard);
                            const optionItems = optionsContainer.querySelectorAll('.option-item');
                            const optionCount = optionItems.length;

                            // Create new option
                            const newOption = document.createElement('div');
                            newOption.className = 'option-item flex items-center';
                            newOption.innerHTML = `
                        <input type="radio" name="questions[${questionIndex}][correct]" value="${optionCount}" class="h-5 w-5 text-prep-blue border-gray-300 focus:ring-prep-blue">
                        <input type="text" name="questions[${questionIndex}][options][${optionCount}]" class="ml-3 flex-1 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-prep-blue focus:border-prep-blue" placeholder="Javob variantini kiriting" required>
                        <button type="button" class="remove-option ml-2 p-1.5 rounded-full text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    `;

                            // Insert before the add option button
                            optionsContainer.insertBefore(newOption, addOptionBtn);
                            lucide.createIcons();

                            // Show remove buttons if there are more than 2 options
                            if (optionCount + 1 > 2) {
                                const removeButtons = optionsContainer.querySelectorAll('.remove-option');
                                removeButtons.forEach(button => {
                                    button.classList.remove('hidden');
                                });
                            }
                        }

                        // Remove option
                        if (e.target.closest('.remove-option')) {
                            const removeBtn = e.target.closest('.remove-option');
                            const optionItem = removeBtn.closest('.option-item');
                            const optionsContainer = optionItem.closest('.options-container');
                            const questionCard = optionItem.closest('.question-card');
                            const questionIndex = Array.from(questionsContainer.children).indexOf(questionCard);

                            // Don't remove if there are only 2 options
                            if (optionsContainer.querySelectorAll('.option-item').length > 2) {
                                optionItem.remove();

                                // Update option names and values
                                const optionItems = optionsContainer.querySelectorAll('.option-item');
                                optionItems.forEach((item, index) => {
                                    const radio = item.querySelector('input[type="radio"]');
                                    const textInput = item.querySelector('input[type="text"]');

                                    radio.name = `questions[${questionIndex}][correct]`;
                                    radio.value = index;
                                    textInput.name = `questions[${questionIndex}][options][${index}]`;
                                });

                                // Hide remove buttons if there are only 2 options
                                if (optionItems.length <= 2) {
                                    const removeButtons = optionsContainer.querySelectorAll('.remove-option');
                                    removeButtons.forEach(button => {
                                        button.classList.add('hidden');
                                    });
                                }
                            }
                        }

                        // Clear image
                        if (e.target.closest('.clear-image')) {
                            const clearBtn = e.target.closest('.clear-image');
                            const questionCard = clearBtn.closest('.question-card');
                            const imageInput = questionCard.querySelector('.question-image-input');
                            const imagePreviewContainer = questionCard.querySelector('.image-preview-container');
                            const imageUploadPlaceholder = questionCard.querySelector('.image-upload-placeholder');

                            // Clear file input
                            imageInput.value = '';

                            // Hide preview and show placeholder
                            imagePreviewContainer.classList.add('hidden');
                            imageUploadPlaceholder.classList.remove('hidden');

                            // Hide clear button
                            clearBtn.classList.add('hidden');
                        }
                    });

                    questionsContainer.addEventListener('change', function(e) {
                        if (e.target.classList.contains('question-image-input')) {
                            const imageInput = e.target;
                            const file = imageInput.files[0];
                            const questionCard = imageInput.closest('.question-card');
                            const imagePreviewContainer = questionCard.querySelector('.image-preview-container');
                            const imagePreview = questionCard.querySelector('.image-preview');
                            const imageUploadPlaceholder = questionCard.querySelector('.image-upload-placeholder');
                            const clearImageBtn = questionCard.querySelector('.clear-image');

                            if (file) {
                                // Check file type
                                const validTypes = ['image/jpeg', 'image/png', 'image/gif'];
                                if (!validTypes.includes(file.type)) {
                                    alert('Faqat JPG, PNG, GIF formatidagi rasmlarni yuklash mumkin');
                                    imageInput.value = '';
                                    return;
                                }

                                // Check file size
                                if (file.size > MAX_FILE_SIZE) {
                                    alert('Rasm hajmi 2MB dan oshmasligi kerak');
                                    imageInput.value = '';
                                    return;
                                }

                                // Show preview
                                const reader = new FileReader();
                                reader.onload = function(e) {
                                    imagePreview.src = e.target.result;
                                    imagePreviewContainer.classList.remove('hidden');
                                    imageUploadPlaceholder.classList.add('hidden');
                                    clearImageBtn.classList.remove('hidden');
                                };
                                reader.readAsDataURL(file);
                            }
                        }
                    });

                    // Handle drag and drop for images
                    questionsContainer.addEventListener('dragover', function(e) {
                        if (e.target.closest('.image-upload-container')) {
                            e.preventDefault();
                            const container = e.target.closest('.image-upload-container');
                            container.classList.add('border-prep-blue', 'bg-blue-50');
                        }
                    });

                    questionsContainer.addEventListener('dragleave', function(e) {
                        if (e.target.closest('.image-upload-container')) {
                            e.preventDefault();
                            const container = e.target.closest('.image-upload-container');
                            container.classList.remove('border-prep-blue', 'bg-blue-50');
                        }
                    });

                    questionsContainer.addEventListener('drop', function(e) {
                        if (e.target.closest('.image-upload-container')) {
                            e.preventDefault();
                            const container = e.target.closest('.image-upload-container');
                            container.classList.remove('border-prep-blue', 'bg-blue-50');

                            const file = e.dataTransfer.files[0];
                            if (file && file.type.startsWith('image/')) {
                                const imageInput = container.querySelector('.question-image-input');

                                // Create a DataTransfer object and add the file
                                const dataTransfer = new DataTransfer();
                                dataTransfer.items.add(file);
                                imageInput.files = dataTransfer.files;

                                // Trigger change event
                                imageInput.dispatchEvent(new Event('change'));
                            }
                        }
                    });

                    // Make image upload containers clickable
                    questionsContainer.addEventListener('click', function(e) {
                        if (e.target.closest('.image-upload-container')) {
                            const container = e.target.closest('.image-upload-container');
                            const imageInput = container.querySelector('.question-image-input');
                            imageInput.click();
                        }
                    });

                    // Function to add a new question
                    function addQuestion() {
                        // Clone the template
                        const questionNode = document.importNode(questionTemplate.content, true);

                        // Update question number and names
                        const questionNumber = questionNode.querySelector('.question-number');
                        questionNumber.textContent = questionCount + 1;

                        const questionText = questionNode.querySelector('.question-text');
                        questionText.name = `questions[${questionCount}][text]`;

                        const imageInput = questionNode.querySelector('.question-image-input');
                        imageInput.name = `questions[${questionCount}][image]`;

                        const radioInputs = questionNode.querySelectorAll('input[type="radio"]');
                        radioInputs.forEach((radio, index) => {
                            radio.name = `questions[${questionCount}][correct]`;
                            radio.value = index;
                        });

                        const optionInputs = questionNode.querySelectorAll('.option-item input[type="text"]');
                        optionInputs.forEach((input, index) => {
                            input.name = `questions[${questionCount}][options][${index}]`;
                        });

                        // Append to container
                        questionsContainer.appendChild(questionNode);

                        // Initialize Lucide icons for the new question
                        lucide.createIcons();

                        // Increment question count
                        questionCount++;
                    }

                    // Function to update question numbers
                    function updateQuestionNumbers() {
                        const questions = questionsContainer.querySelectorAll('.question-card');

                        questions.forEach((question, index) => {
                            // Update question number
                            const numberSpan = question.querySelector('.question-number');
                            numberSpan.textContent = index + 1;

                            // Update input names
                            const textArea = question.querySelector('textarea');
                            textArea.name = `questions[${index}][text]`;

                            const imageInput = question.querySelector('.question-image-input');
                            imageInput.name = `questions[${index}][image]`;

                            const radioInputs = question.querySelectorAll('input[type="radio"]');
                            radioInputs.forEach((radio, radioIndex) => {
                                radio.name = `questions[${index}][correct]`;
                                radio.value = radioIndex;
                            });

                            const optionInputs = question.querySelectorAll('.option-item input[type="text"]');
                            optionInputs.forEach((input, optionIndex) => {
                                input.name = `questions[${index}][options][${optionIndex}]`;
                            });
                        });

                        questionCount = questions.length;
                    }

                    testForm.addEventListener('submit', async function(e) {
                        e.preventDefault();

                        const submitButton = testForm.querySelector('button[type="submit"]');
                        const originalText = submitButton.innerHTML;
                        submitButton.disabled = true;
                        submitButton.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Yuklanmoqda...';

                        try {
                            const testData = {
                                title: document.getElementById('testTitle').value,
                                lessonId: document.getElementById('testSubject').value,
                                duration: parseInt(document.getElementById('testDuration').value),
                                questions: []
                            };

                            const questionCards = document.querySelectorAll('.question-card');

                            for (let i = 0; i < questionCards.length; i++) {
                                const card = questionCards[i];
                                const questionText = card.querySelector('textarea').value;
                                const imageInput = card.querySelector('.question-image-input');
                                const correctAnswerIndex = parseInt(Array.from(card.querySelectorAll('input[type="radio"]')).find(radio => radio.checked).value);
                                const optionInputs = card.querySelectorAll('.option-item input[type="text"]');

                                const question = {
                                    text: questionText,
                                    image: null,
                                    options: [],
                                    correctOptionIndex: correctAnswerIndex
                                };

                                if (imageInput.files.length > 0) {
                                    const imageFile = imageInput.files[0];
                                    try {
                                        const base64String = await fileToBase64(imageFile);

                                        question.image = base64String;
                                    } catch (error) {
                                        console.error('Error converting image to base64:', error);
                                        alert('Rasmni yuklashda xatolik yuz berdi');
                                        submitButton.disabled = false;
                                        submitButton.innerHTML = originalText;
                                        return;
                                    }
                                }

                                // Add options
                                Array.from(optionInputs).forEach((input, optIndex) => {
                                    question.options.push({
                                        text: input.value
                                    });
                                });

                                testData.questions.push(question);
                            }

                            const response = await fetch('/api/test/add', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(testData)
                            });

                            if (!response.ok) {
                                throw new Error(`Serverda xatolik: ${response.status}`);
                            }

                            alert('Test muvaffaqiyatli saqlandi!');
                            console.log(testData)
                        } catch (error) {
                            console.error('Error preparing test data:', error);
                            alert('Xatolik yuz berdi: ' + error.message);
                        } finally {
                            submitButton.disabled = false;
                            submitButton.innerHTML = originalText;
                        }
                    });


                    function fileToBase64(file) {
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => {
                                const base64String = reader.result.split(',')[1];
                                resolve(base64String);
                            };
                            reader.onerror = error => reject(error);
                            reader.readAsDataURL(file);
                        });
                    }
                });

            </script>
        </div>
    </body>
